</defs><rect x="1" y="1" width="1198" height="486" rx="22" fill="url(#card)" stroke="#16457a"/><rect x="180.0" y="1" width="840.0" height="1.5" fill="url(#line)"/><rect x="48" y="44" width="60" height="60" rx="16.8" fill="url(#tealSoft)" stroke="#2dd4bf" stroke-opacity="0.55"/><g transform="translate(63.0 59.0) scale(1.25)" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></g><text x="128" y="66" font-family="ui-monospace, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="3" fill-opacity="1">05  ·  MÉTHODE</text><text x="128" y="98" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f4f8fc" text-anchor="start" letter-spacing="0" fill-opacity="1">Notre approche</text><rect x="48.0" y="148" width="540.0" height="136" rx="16" fill="url(#tile)" stroke="#16457a"/><rect x="72.0" y="172" width="52" height="52" rx="14.560000000000002" fill="url(#tealSoft)" stroke="#2dd4bf" stroke-opacity="0.3"/><g transform="translate(85.0 185.0) scale(1.0833333333333333)" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></g><text x="144.0" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f8fc" text-anchor="start" letter-spacing="0" fill-opacity="1">Le bon outil pour chaque problème</text><text x="144.0" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">Plusieurs langages backend, choisis selon</text><text x="144.0" y="256" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">les contraintes du projet, pas par habitude.</text><rect x="612.0" y="148" width="540.0" height="136" rx="16" fill="url(#tile)" stroke="#16457a"/><rect x="636.0" y="172" width="52" height="52" rx="14.560000000000002" fill="url(#tealSoft)" stroke="#2dd4bf" stroke-opacity="0.3"/><g transform="translate(649.0 185.0) scale(1.0833333333333333)" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></g><text x="708.0" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f8fc" text-anchor="start" letter-spacing="0" fill-opacity="1">Contrats d'API d'abord</text><text x="708.0" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">Schémas et spécifications validés avant</text><text x="708.0" y="256" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">le code : front et back avancent en parallèle.</text><rect x="48.0" y="304" width="540.0" height="136" rx="16" fill="url(#tile)" stroke="#16457a"/><rect x="72.0" y="328" width="52" height="52" rx="14.560000000000002" fill="url(#tealSoft)" stroke="#2dd4bf" stroke-opacity="0.3"/><g transform="translate(85.0 341.0) scale(1.0833333333333333)" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g><text x="144.0" y="356" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f8fc" text-anchor="start" letter-spacing="0" fill-opacity="1">Sécurité par défaut</text><text x="144.0" y="388" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">Validation des entrées, gestion des secrets,</text><text x="144.0" y="412" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">contrôle d'accès sur chaque endpoint.</text><rect x="612.0" y="304" width="540.0" height="136" rx="16" fill="url(#tile)" stroke="#16457a"/><rect x="636.0" y="328" width="52" height="52" rx="14.560000000000002" fill="url(#tealSoft)" stroke="#2dd4bf" stroke-opacity="0.3"/><g transform="translate(649.0 341.0) scale(1.0833333333333333)" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></g><text x="708.0" y="356" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f8fc" text-anchor="start" letter-spacing="0" fill-opacity="1">Revue, tests et CI</text><text x="708.0" y="388" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">Chaque pull request est relue et testée</text><text x="708.0" y="412" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9bdd3" text-anchor="start" letter-spacing="0" fill-opacity="1">automatiquement avant la fusion.</text></svg>